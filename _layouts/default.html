<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="#top">
        <img class="brand-logo" src="/brma-website-qa/assets/images/brma-logo.png" alt="BRMA logo">
        <span>Business Recovery Managers Association</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#event">Events</a>
        <a href="#membership">Membership</a>
        <a href="#news">News</a>
        <a href="#leadership">Leadership</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </nav>

  <main id="top">
    {{ content }}
  </main>

  <div class="qa-badge">QA SITE</div>

  <script>
    (function () {
      const quotes = Array.from(document.querySelectorAll('.quote'));
      if (!quotes.length) return;
      let current = 0;
      function show(i) {
        quotes.forEach((q, idx) => q.classList.toggle('active', idx === i));
      }
      document.querySelector('[data-prev]')?.addEventListener('click', function () {
        current = (current - 1 + quotes.length) % quotes.length;
        show(current);
      });
      document.querySelector('[data-next]')?.addEventListener('click', function () {
        current = (current + 1) % quotes.length;
        show(current);
      });
      setInterval(function () {
        current = (current + 1) % quotes.length;
        show(current);
      }, 8000);
    })();
  </script>
  <script>
    (function () {
      const slider = document.querySelector('.hero-slider');
      if (!slider) return;

      const slides = Array.from(slider.querySelectorAll('.hero-slide'));
      const dots = Array.from(slider.querySelectorAll('[data-hero-dot]'));
      const prev = slider.querySelector('[data-hero-prev]');
      const next = slider.querySelector('[data-hero-next]');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let current = 0;
      let timer = null;

      function show(index) {
        current = (index + slides.length) % slides.length;
        slides.forEach((slide, idx) => slide.classList.toggle('active', idx === current));
        dots.forEach((dot, idx) => {
          dot.classList.toggle('active', idx === current);
          dot.setAttribute('aria-current', idx === current ? 'true' : 'false');
        });
      }

      function stop() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      function start() {
        if (reduceMotion || slides.length < 2) return;
        stop();
        timer = setInterval(function () { show(current + 1); }, 6500);
      }

      prev?.addEventListener('click', function () {
        show(current - 1);
        start();
      });

      next?.addEventListener('click', function () {
        show(current + 1);
        start();
      });

      dots.forEach((dot, index) => {
        dot.addEventListener('click', function () {
          show(index);
          start();
        });
      });

      slider.addEventListener('mouseenter', stop);
      slider.addEventListener('mouseleave', start);
      slider.addEventListener('focusin', stop);
      slider.addEventListener('focusout', start);

      show(0);
      start();
    })();
  </script>
</body>
</html>
